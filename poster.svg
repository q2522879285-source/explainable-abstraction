<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081226"/>
      <stop offset="0.55" stop-color="#101d3d"/>
      <stop offset="1" stop-color="#201438"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#65e7ff"/>
      <stop offset="1" stop-color="#d68bff"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#182c51" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#141832" stop-opacity="0.96"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="42"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.32"/></filter>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg)"/>
  <circle cx="112" cy="224" r="210" fill="#31d9ff" opacity="0.12" filter="url(#blur)"/>
  <circle cx="970" cy="760" r="230" fill="#b670ff" opacity="0.12" filter="url(#blur)"/>
  <circle cx="940" cy="1700" r="180" fill="#ff6ab5" opacity="0.1" filter="url(#blur)"/>
  <path d="M70 330 C270 250, 380 390, 530 300 S810 250, 1010 345" fill="none" stroke="#6be8ff" stroke-opacity="0.16" stroke-width="2"/>
  <path d="M20 1510 C260 1420, 420 1560, 620 1460 S880 1400, 1090 1480" fill="none" stroke="#d68bff" stroke-opacity="0.14" stroke-width="2"/>

  <text x="76" y="112" fill="#8cecff" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" letter-spacing="4">OPEN SKILL  /  EXPLAINABLE ABSTRACTION</text>
  <text x="76" y="218" fill="#ffffff" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="66" font-weight="800">让抽象结果</text>
  <text x="76" y="296" fill="#ffffff" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="66" font-weight="800">真正可用</text>
  <text x="80" y="354" fill="#a9bad6" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="27">不是把话说复杂，而是把理解接到行动。</text>
  <rect x="78" y="395" width="922" height="2" fill="url(#line)" opacity="0.8"/>

  <text x="80" y="458" fill="#6be8ff" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="22" font-weight="700" letter-spacing="2">ONE FLOW</text>
  <text x="80" y="500" fill="#e9f2ff" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="34" font-weight="700">把模型输出变成别人能看懂、能检查、能接手的交付物</text>

  <!-- flow rail -->
  <path d="M126 587 L126 1518" stroke="#3b587d" stroke-width="4" stroke-dasharray="8 18"/>
  <path d="M126 587 L126 1518" stroke="url(#line)" stroke-width="2" opacity="0.8"/>

  <!-- card 1 -->
  <g filter="url(#shadow)">
    <rect x="174" y="558" width="826" height="212" rx="28" fill="url(#card)" stroke="#3b6f9e" stroke-width="2"/>
    <circle cx="126" cy="610" r="30" fill="#65e7ff"/>
    <text x="126" y="619" text-anchor="middle" fill="#081226" font-family="Segoe UI, sans-serif" font-size="22" font-weight="800">01</text>
    <text x="218" y="620" fill="#65e7ff" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="25" font-weight="700">抽象结构</text>
    <text x="218" y="670" fill="#ffffff" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="39" font-weight="800">先把骨架留下</text>
    <text x="218" y="719" fill="#a9bad6" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="24">目标 · 对象 · 关系 · 约束 · 证据 · 假设</text>
  </g>
  <path d="M126 770 L126 808" stroke="#65e7ff" stroke-width="4"/>
  <path d="M116 799 L126 814 L136 799" fill="none" stroke="#65e7ff" stroke-width="4"/>

  <!-- card 2 -->
  <g filter="url(#shadow)">
    <rect x="174" y="820" width="826" height="212" rx="28" fill="url(#card)" stroke="#526cbd" stroke-width="2"/>
    <circle cx="126" cy="872" r="30" fill="#8da8ff"/>
    <text x="126" y="881" text-anchor="middle" fill="#111a39" font-family="Segoe UI, sans-serif" font-size="22" font-weight="800">02</text>
    <text x="218" y="882" fill="#a9baff" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="25" font-weight="700">人话解释</text>
    <text x="218" y="932" fill="#ffffff" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="39" font-weight="800">把术语接到现象</text>
    <text x="218" y="981" fill="#a9bad6" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="24">一句结论 + 机制说明：它看起来怎样？下一步做什么？</text>
  </g>
  <path d="M126 1032 L126 1070" stroke="#8da8ff" stroke-width="4"/>
  <path d="M116 1061 L126 1076 L136 1061" fill="none" stroke="#8da8ff" stroke-width="4"/>

  <!-- card 3 -->
  <g filter="url(#shadow)">
    <rect x="174" y="1082" width="826" height="212" rx="28" fill="url(#card)" stroke="#8e70cc" stroke-width="2"/>
    <circle cx="126" cy="1134" r="30" fill="#c29bff"/>
    <text x="126" y="1143" text-anchor="middle" fill="#21153e" font-family="Segoe UI, sans-serif" font-size="22" font-weight="800">03</text>
    <text x="218" y="1144" fill="#cdaeff" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="25" font-weight="700">可检查结构</text>
    <text x="218" y="1194" fill="#ffffff" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="39" font-weight="800">让别人能复核</text>
    <text x="218" y="1243" fill="#a9bad6" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="24">条件 · 责任 · 观察信号 · 停止条件 · 证据位置</text>
  </g>
  <path d="M126 1294 L126 1332" stroke="#c29bff" stroke-width="4"/>
  <path d="M116 1323 L126 1338 L136 1323" fill="none" stroke="#c29bff" stroke-width="4"/>

  <!-- card 4 -->
  <g filter="url(#shadow)">
    <rect x="174" y="1344" width="826" height="212" rx="28" fill="url(#card)" stroke="#c66fba" stroke-width="2"/>
    <circle cx="126" cy="1396" r="30" fill="#ff9bdf"/>
    <text x="126" y="1405" text-anchor="middle" fill="#3a1734" font-family="Segoe UI, sans-serif" font-size="22" font-weight="800">04</text>
    <text x="218" y="1406" fill="#ffb4e5" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="25" font-weight="700">可执行产物</text>
    <text x="218" y="1456" fill="#ffffff" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="39" font-weight="800">选择最小合适媒介</text>
    <text x="218" y="1505" fill="#a9bad6" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="24">说明文 · 图表 · 网页 · 脚本 · 解释视频 · 原型</text>
  </g>
  <path d="M126 1556 L126 1594" stroke="#ff9bdf" stroke-width="4"/>
  <path d="M116 1585 L126 1600 L136 1585" fill="none" stroke="#ff9bdf" stroke-width="4"/>

  <!-- card 5 -->
  <g filter="url(#shadow)">
    <rect x="174" y="1606" width="826" height="212" rx="28" fill="url(#card)" stroke="#ef8c78" stroke-width="2"/>
    <circle cx="126" cy="1658" r="30" fill="#ffb08b"/>
    <text x="126" y="1667" text-anchor="middle" fill="#3d211c" font-family="Segoe UI, sans-serif" font-size="22" font-weight="800">05</text>
    <text x="218" y="1668" fill="#ffc1a5" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="25" font-weight="700">回读验证</text>
    <text x="218" y="1718" fill="#ffffff" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="39" font-weight="800">确认真的能用</text>
    <text x="218" y="1767" fill="#a9bad6" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="24">能定位原意 · 能开始行动 · 能打开/运行/接手</text>
  </g>

  <rect x="80" y="1840" width="920" height="2" fill="url(#line)" opacity="0.8"/>
  <text x="80" y="1880" fill="#e9f2ff" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="25" font-weight="700">媒介按问题选，不按工具堆。</text>
  <text x="1000" y="1880" text-anchor="end" fill="#8cecff" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="21" letter-spacing="1">MIT · OPEN SOURCE</text>
</svg>

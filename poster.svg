<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#111827" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="#f7f4ee"/>

  <!-- Header -->
  <text x="64" y="80" fill="#111827" font-family="Consolas, monospace" font-size="20" font-weight="700" letter-spacing="2.5">OPEN SOURCE SKILL / V1.0</text>
  <text x="1016" y="80" text-anchor="end" fill="#ff5738" font-family="Consolas, monospace" font-size="20" font-weight="700">EA—001</text>
  <path d="M64 112H1016" stroke="#111827" stroke-width="3"/>

  <!-- Hero -->
  <g filter="url(#softShadow)">
    <rect x="64" y="150" width="952" height="370" rx="26" fill="#111827"/>
    <rect x="64" y="150" width="14" height="370" rx="7" fill="#ff5738"/>
  </g>
  <text x="108" y="212" fill="#ff5738" font-family="Consolas, monospace" font-size="18" font-weight="700" letter-spacing="2">EXPLAINABLE ABSTRACTION</text>
  <text x="972" y="212" text-anchor="end" fill="#f7f4ee" font-family="Consolas, monospace" font-size="17" font-weight="700">OPEN SOURCE / 01</text>
  <text x="108" y="312" fill="#f7f4ee" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="86" font-weight="900">让抽象结果，</text>
  <rect x="108" y="430" width="560" height="12" rx="6" fill="#ff5738"/>
  <text x="108" y="405" fill="#f7f4ee" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="86" font-weight="900">变成下一步动作</text>
  <text x="108" y="465" fill="#cbd5e1" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="23">把理解、检查、执行串成一条可复用路径。</text>

  <!-- Intro -->
  <text x="64" y="606" fill="#ff5738" font-family="Consolas, monospace" font-size="17" font-weight="700" letter-spacing="2">ONE IDEA / THREE MOVES</text>
  <text x="1016" y="606" text-anchor="end" fill="#111827" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="23">复杂不是问题，无法接手才是。</text>
  <path d="M64 638H1016" stroke="#111827" stroke-opacity="0.18" stroke-width="2"/>

  <!-- Single narrative axis -->
  <path d="M164 706V1414" stroke="#ff5738" stroke-width="4"/>
  <path d="M152 706H176M152 970H176M152 1234H176M152 1414H176" stroke="#ff5738" stroke-width="4"/>

  <!-- Step 01 -->
  <text x="64" y="794" fill="none" stroke="#ff5738" stroke-width="3" font-family="Consolas, monospace" font-size="112" font-weight="700">01</text>
  <text x="250" y="730" fill="#ff5738" font-family="Consolas, monospace" font-size="19" font-weight="700" letter-spacing="1.3">01 / UNDERSTAND</text>
  <text x="250" y="790" fill="#111827" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="46" font-weight="900">先把问题说清楚</text>
  <text x="250" y="838" fill="#475569" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="23">目标 · 对象 · 关系 · 约束 · 证据 · 假设</text>
  <text x="250" y="892" fill="#ff5738" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="20" font-weight="700">可检查结果：一张能对齐的结构图</text>
  <text x="1016" y="730" text-anchor="end" fill="#64748b" font-family="Consolas, monospace" font-size="16">INPUT → STRUCTURE</text>
  <path d="M250 936H1016" stroke="#111827" stroke-opacity="0.18" stroke-width="2"/>

  <!-- Step 02 -->
  <text x="64" y="1058" fill="none" stroke="#111827" stroke-width="3" font-family="Consolas, monospace" font-size="112" font-weight="700">02</text>
  <text x="250" y="994" fill="#ff5738" font-family="Consolas, monospace" font-size="19" font-weight="700" letter-spacing="1.3">02 / VERIFY</text>
  <text x="250" y="1054" fill="#111827" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="46" font-weight="900">再让依据可复核</text>
  <text x="250" y="1102" fill="#475569" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="23">证据、边界、责任、停止条件都能回读。</text>
  <text x="250" y="1156" fill="#ff5738" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="20" font-weight="700">可检查结果：能从结果回到原意</text>
  <text x="1016" y="994" text-anchor="end" fill="#64748b" font-family="Consolas, monospace" font-size="16">EVIDENCE → BOUNDARY</text>
  <path d="M250 1200H1016" stroke="#111827" stroke-opacity="0.18" stroke-width="2"/>

  <!-- Step 03 -->
  <text x="64" y="1322" fill="none" stroke="#ff5738" stroke-width="3" font-family="Consolas, monospace" font-size="112" font-weight="700">03</text>
  <text x="250" y="1258" fill="#ff5738" font-family="Consolas, monospace" font-size="19" font-weight="700" letter-spacing="1.3">03 / ACT</text>
  <text x="250" y="1318" fill="#111827" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="46" font-weight="900">最后把结论交给行动</text>
  <text x="250" y="1366" fill="#475569" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="23">按问题选媒介：文字、图表、网页或脚本。</text>
  <text x="250" y="1420" fill="#ff5738" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="20" font-weight="700">可执行结果：能打开、能运行、能接手</text>
  <text x="1016" y="1258" text-anchor="end" fill="#64748b" font-family="Consolas, monospace" font-size="16">OUTPUT → NEXT ACTION</text>

  <!-- Conclusion -->
  <rect x="64" y="1490" width="952" height="150" rx="18" fill="#111827"/>
  <rect x="64" y="1490" width="10" height="150" rx="5" fill="#ff5738"/>
  <text x="106" y="1548" fill="#f7f4ee" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="31" font-weight="800">不是给你一个答案，</text>
  <text x="106" y="1593" fill="#f7f4ee" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="31" font-weight="800">而是给你一条可检查、可复用、可执行的路径。</text>
  <text x="972" y="1548" text-anchor="end" fill="#ff5738" font-family="Consolas, monospace" font-size="18" font-weight="700">READ → USE → VERIFY</text>

  <!-- Open-source CTA -->
  <rect x="0" y="1680" width="1080" height="240" fill="#0b1220"/>
  <rect x="64" y="1718" width="208" height="40" rx="20" fill="#ff5738"/>
  <text x="168" y="1745" text-anchor="middle" fill="#111827" font-family="Consolas, monospace" font-size="17" font-weight="800">OPEN SOURCE /</text>
  <text x="64" y="1812" fill="#f7f4ee" font-family="Consolas, monospace" font-size="28" font-weight="700">github.com/q2522879285-source/</text>
  <text x="64" y="1854" fill="#f7f4ee" font-family="Consolas, monospace" font-size="28" font-weight="700">explainable-abstraction</text>
  <text x="64" y="1892" fill="#94a3b8" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="17">Read the source · reuse the method · MIT License</text>
  <text x="1016" y="1892" text-anchor="end" fill="#ff5738" font-family="Consolas, monospace" font-size="17" font-weight="700">github.com</text>
</svg>
